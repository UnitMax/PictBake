<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PictBake Error</title>
    <link rel="stylesheet" href="error.css">
  </head>
  <body>
    <main class="error-shell">
      <p class="eyebrow">PictBake</p>
      <h1>Conversion did not finish</h1>
      <p id="message" class="message"></p>
      <p id="source" class="source"></p>

      <div class="actions">
        <button type="button" id="open-converter" class="primary-button">Open Converter</button>
        <button type="button" id="open-options" class="secondary-button">Options</button>
        <button type="button" id="close-page" class="secondary-button">Close</button>
      </div>
    </main>

    <script src="error.js"></script>
  </body>
</html>
